<div id="app">
 <header>
  <div><div class="heading">MATH × PATHFINDING</div><div class="brand">GRAPH <b>RUNNER</b><span class="tiny"> 3.0</span></div></div>

 <div class="workspace">

<script>
'use strict';
// Independent of external CDNs, libraries, or accounts. Can be deployed as index.html on GitHub Pages.
const STAGES=[
 {title:'山を越えろ',mission:'壁の上を通る放物線をつくろう',hint:'x(8−x) は両端で0になり、中央で正になります。',solution:'x*(8-x)/8',difficulty:1,obstacles:[{x:3.2,y:-3.5,w:1.6,h:4.8}],gates:[]},
 {title:'谷をくぐれ',mission:'今度は壁の下を通り抜けよう',hint:'前の放物線にマイナスをつけたら？',solution:'-x*(8-x)/8',difficulty:1,obstacles:[{x:3.2,y:-0.8,w:1.6,h:4.3}],gates:[]},
 {title:'S字の迷路',mission:'前半で上、後半で下を通ろう',hint:'x、(x−4)、(8−x) を掛けると符号が切り替わります。',solution:'-0.07*x*(x-4)*(8-x)',difficulty:2,obstacles:[{x:1.35,y:-3.5,w:1.3,h:4.1},{x:5.35,y:-0.6,w:1.3,h:4.1}],gates:[]},
 {title:'細いトンネル',mission:'上下の障害物の間を抜けよう',hint:'頂点が約 (4,2) の放物線をつくろう。',solution:'x*(8-x)/8',difficulty:2,obstacles:[{x:3.45,y:-3.5,w:1.1,h:5.15},{x:3.45,y:2.43,w:1.1,h:1.07}],gates:[{x:4,y:2,r:.33}]},
 {title:'ふたつの門',mission:'指定された2つの紫の輪を通ろう',hint:'x=4 で符号が入れ替わる3次式を考えよう。',solution:'-0.07*x*(x-4)*(8-x)',difficulty:3,obstacles:[{x:1.5,y:-3.5,w:1,h:4.15},{x:5.5,y:-0.65,w:1,h:4.15}],gates:[{x:2,y:1.68,r:.36},{x:6,y:-1.68,r:.36}]},
 {title:'正弦の波',mission:'波の山と谷を順番に通過しよう',hint:'sin(πx/4) を使うと x=0,4,8 で0になります。',solution:'1.7*sin(pi*x/4)',difficulty:3,obstacles:[{x:1.5,y:-3.5,w:1,h:4.5},{x:5.5,y:-1,w:1,h:4.5}],gates:[{x:2,y:1.7,r:.33},{x:6,y:-1.7,r:.33}]},
 {title:'ふたこぶの山',mission:'山・谷・山を一つの式で描こう',hint:'abs(x−4) を掛けて、中央で0になる形を考えよう。',solution:'0.07*x*(8-x)*abs(x-4)',difficulty:4,obstacles:[{x:1.5,y:-3.5,w:1,h:4.35},{x:3.75,y:.8,w:.5,h:2.7},{x:5.5,y:-3.5,w:1,h:4.35}],gates:[{x:2,y:1.68,r:.34},{x:4,y:0,r:.28},{x:6,y:1.68,r:.34}]},
 {title:'非対称の三次式',mission:'左は低めに上昇、右は深く潜ろう',hint:'x=3 と x=8 を根に含む3次式を試そう。',solution:'0.06*x*(x-3)*(x-8)',difficulty:4,obstacles:[{x:1.75,y:-3.5,w:.5,h:3.55},{x:4.5,y:-.62,w:1,h:4.12}],gates:[{x:2,y:.72,r:.30},{x:5,y:-1.8,r:.36}]},
 {title:'四重の波',mission:'4つのゲートを上下交互に通過しよう',hint:'sin(πx/2) の周期を利用しよう。',solution:'1.6*sin(pi*x/2)',difficulty:5,obstacles:[{x:.72,y:-3.5,w:.56,h:4.15},{x:2.72,y:-.65,w:.56,h:4.15},{x:4.72,y:-3.5,w:.56,h:4.15},{x:6.72,y:-.65,w:.56,h:4.15}],gates:[{x:1,y:1.6,r:.29},{x:3,y:-1.6,r:.29},{x:5,y:1.6,r:.29},{x:7,y:-1.6,r:.29}]},
 {title:'根号の抜け道',mission:'両端は低く、中央は高い曲線をつくろう',hint:'√(x(8−x)) は両端で0になります。',solution:'0.62*sqrt(x*(8-x))',difficulty:5,obstacles:[{x:3.55,y:-3.5,w:.9,h:5.4},{x:3.55,y:2.89,w:.9,h:.61}],gates:[{x:1,y:1.6405,r:.25},{x:4,y:2.48,r:.28},{x:7,y:1.6405,r:.25}]},

];
const COLORS=['#66e6d1','#ffbd6a','#a48aff','#80b4ff'];
const $=s=>document.querySelector(s);
const canvas=$('#canvas'),ctx=canvas.getContext('2d');
const world={xmin:-1.2,xmax:9.2,ymin:-3.5,ymax:3.5};
let stage=0,expressions=[],nextId=1,activeId=null,riderX=0,playing=false,finished=false,crashed=false,frame=0,lastTime=0,trail=[],cw=1,ch=1,ratio=1,gateIndex=0;
let unlocked=1;try{unlocked=clampUnlock(Number(localStorage.getItem("graphRunnerUnlocked")||1))}catch{}
function clampUnlock(n){return Number.isFinite(n)?Math.max(1,Math.min(STAGES.length,Math.floor(n))):1}
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const XP=x=>(x-world.xmin)/(world.xmax-world.xmin)*cw;
const YP=y=>(world.ymax-y)/(world.ymax-world.ymin)*ch;
const SW=x=>x/(world.xmax-world.xmin)*cw;
const SH=y=>y/(world.ymax-world.ymin)*ch;
function parseFunction(input){
 let s=input.trim().replace(/^\s*(?:y\s*=|f\s*\(\s*x\s*\)\s*=)/i,'').replace(/[−–]/g,'-').replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/π/g,'pi').replace(/²/g,'^2').replace(/³/g,'^3');
 if(s.length>180)throw Error('式が長すぎます。');
 if(!s)throw Error('数式を入力してください。');
 let raw=[],i=0;
 while(i<s.length){if(/\s/.test(s[i])){i++;continue}
  let m=s.slice(i).match(/^(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?/i);
  if(m){raw.push({k:'n',v:Number(m[0])});i+=m[0].length;continue}
  m=s.slice(i).match(/^[a-zA-Z]+/);
  if(m){const v=m[0].toLowerCase();if(!['x','pi','e','sin','cos','tan','sqrt','abs','exp','ln','log'].includes(v))throw Error('未対応の文字：'+m[0]);raw.push({k:'id',v});i+=m[0].length;continue}
  if('+-*/^()'.includes(s[i])){raw.push({k:s[i],v:s[i]});i++;continue}
  throw Error('未対応の記号：'+s[i]);
 }
 const isFn=v=>['sin','cos','tan','sqrt','abs','exp','ln','log'].includes(v);
 const t=[];for(let n=0;n<raw.length;n++){let a=raw[n],b=raw[n+1];t.push(a);if(!b)continue;
  let left=a.k==='n'||a.k===')'||(a.k==='id'&&!isFn(a.v));let right=b.k==='n'||b.k==='('||b.k==='id';
  if(left&&right)t.push({k:'*',v:'*'});
 }
 let p=0,depth=0;const peek=()=>t[p]?.k||'end';const take=k=>{if(peek()===k){p++;return true}return false};
 function atom(){if(++depth>100)throw Error('式が複雑すぎます');let result;
  if(take('(')){result=add();if(!take(')'))throw Error('「)」を閉じてください。')}
  else if(peek()==='n'){let c=t[p++].v;result=()=>c}
  else if(peek()==='id'){let v=t[p++].v;
   if(v==='x')result=x=>x;
   else if(v==='pi')result=()=>Math.PI;
   else if(v==='e')result=()=>Math.E;
   else if(isFn(v)){if(!take('('))throw Error(v+' の後に「(」が必要です。');let inner=add();if(!take(')'))throw Error('関数の「)」を閉じてください。');let method={sin:Math.sin,cos:Math.cos,tan:Math.tan,sqrt:Math.sqrt,abs:Math.abs,exp:Math.exp,ln:Math.log,log:Math.log10}[v];result=x=>method(inner(x))}
  }
  if(!result)throw Error('式の構文を確認してください。');depth--;return result;
 }
 function unary(){if(take('+'))return unary();if(take('-')){let v=unary();return x=>-v(x)}return power()}
 function power(){let a=atom();if(take('^')){let b=unary(),left=a;a=x=>Math.pow(left(x),b(x))}return a}
 function mul(){let a=unary();while(peek()==='*'||peek()==='/'){let op=t[p++].k,b=unary(),left=a;a=op==='*'?(x=>left(x)*b(x)):(x=>left(x)/b(x))}return a}
 function add(){let a=mul();while(peek()==='+'||peek()==='-'){let op=t[p++].k,b=mul(),left=a;a=op==='+'?(x=>left(x)+b(x)):(x=>left(x)-b(x))}return a}
 let fn=add();if(p!==t.length)throw Error('式の途中に誤りがあります。');return fn;
}
function safe(fn,x){try{return fn?fn(x):NaN}catch{return NaN}}
function collision(x,y,o,rad=.14){let xx=clamp(x,o.x,o.x+o.w),yy=clamp(y,o.y,o.y+o.h);return (xx-x)**2+(yy-y)**2<rad**2}
function pathCheck(fn,st=STAGES[stage]){
 if(!fn)return {ok:false,reason:'有効な数式がありません。'};
 for(let x=0;x<=8.0001;x+=.0125){let xx=Math.min(8,x),y=safe(fn,xx);
  if(!Number.isFinite(y)||y<world.ymin+.12||y>world.ymax-.12)return {ok:false,reason:'コースが画面外に出るか定義されない点があります。',x:xx};
  for(const o of st.obstacles)if(collision(xx,y,o))return {ok:false,reason:'障害物に衝突します。',x:xx};
 }
 for(const [i,g] of (st.gates||[]).entries()){let y=safe(fn,g.x);if(!Number.isFinite(y)||Math.abs(y-g.y)>g.r)return {ok:false,reason:'ゲート'+(i+1)+'を通れません。',x:g.x}}
 return {ok:true};
}
function putStatus(msg,type=''){const el=$('#status');el.textContent=msg;el.className='status '+type}
function activeExpr(){return expressions.find(e=>e.id===activeId)||expressions[0]}
function updateFns(){for(let e of expressions){try{e.fn=parseFunction(e.text);e.error=''}catch(err){e.fn=null;e.error=err.message}}}
function newExpr(text='',select=true){if(expressions.length>=4){putStatus('式は最大4本までです。','bad');return}const id=nextId++;expressions.push({id,text,visible:true,fn:null,error:'',color:COLORS[(id-1)%COLORS.length]});if(select)activeId=id;updateFns();renderRows();draw()}
function resetMotion(quiet=false){cancelAnimationFrame(frame);playing=finished=crashed=false;riderX=0;gateIndex=0;trail=[];lastTime=0;$('#run').disabled=false;$('#run').textContent='▶ 走らせる';$('#next').disabled=true;if(!quiet)putStatus('式を調整して、もう一度挑戦しよう。');draw()}
function renderRows(focusId){const panel=$('#expressions');panel.innerHTML='';for(let ix=0;ix<expressions.length;ix++){const e=expressions[ix];const row=document.createElement('div');row.className='expr-row'+(activeId===e.id?' active':'');row.style.setProperty('--c',e.color);
  const toggle=document.createElement('button');toggle.className='color-toggle'+(e.visible?'':' hidden');toggle.setAttribute('aria-label',e.visible?'グラフを非表示':'グラフを表示');toggle.title='表示/非表示';toggle.addEventListener('click',()=>{e.visible=!e.visible;renderRows();draw()});
  const middle=document.createElement('div');middle.style.minWidth='0';const line=document.createElement('div');line.className='expr-main';const prefix=document.createElement('span');prefix.className='math-prefix';prefix.textContent='y =';
  const input=document.createElement('input');input.className='expr-input';input.type='text';input.setAttribute('autocapitalize','off');input.setAttribute('autocomplete','off');input.spellcheck=false;input.readOnly=window.matchMedia('(max-width:760px)').matches;input.inputMode='none';input.value=e.text;input.placeholder='式を入力';input.dataset.exprId=e.id;input.setAttribute('aria-label','式'+(ix+1));
  input.addEventListener('focus',()=>{activeId=e.id;updateActiveRows();});
  input.addEventListener('input',()=>{e.text=input.value;resetMotion(true);updateFns();updateNotes();draw()});
  input.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();input.blur();run()}});
  line.append(prefix,input);middle.append(line);const note=document.createElement('div');note.className='expr-note';note.dataset.noteId=e.id;middle.append(note);
  const del=document.createElement('button');del.className='expr-action';del.textContent=expressions.length===1?'◎':'×';del.title=expressions.length===1?'この式を選択':'式を削除';del.setAttribute('aria-label',del.title);del.addEventListener('click',()=>{if(expressions.length>1){expressions=expressions.filter(it=>it.id!==e.id);if(activeId===e.id)activeId=expressions[0].id;resetMotion(true);renderRows();draw()}else{activeId=e.id;updateActiveRows()}});
  row.addEventListener('click',ev=>{if(ev.target===row){activeId=e.id;updateActiveRows()}});
  row.append(toggle,middle,del);panel.append(row);
 }
 updateActiveRows();updateNotes();if(focusId){const input=panel.querySelector(`[data-expr-id="${focusId}"]`);input?.focus()}
}
function updateActiveRows(){for(const row of $('#expressions').children){const input=row.querySelector('.expr-input');row.classList.toggle('active',Number(input.dataset.exprId)===activeId)}const ix=expressions.findIndex(e=>e.id===activeId);$('#pathName').textContent=`走行コース：式${ix+1}`}
function updateNotes(){for(const e of expressions){const note=document.querySelector(`[data-note-id="${e.id}"]`);if(!note)continue;note.className='expr-note'+(e.error?' error':'');note.textContent=e.error||((e.id===activeId?'● 走る線':'タップで走行コースに選択')+(e.visible?'':' ／ 非表示'))}}
function refreshStagePicker(){let select=$('#stageSelect'),prev=select.value;select.innerHTML='';STAGES.forEach((item,i)=>{const o=document.createElement('option');o.value=String(i);o.disabled=i>=unlocked;o.textContent=(i>=unlocked?'🔒 ':'')+String(i+1).padStart(2,'0')+' '+item.title;select.append(o)});select.value=String(stage)}
function loadStage(i){if(i>=unlocked||i<0||i>=STAGES.length)return;stage=i;expressions=[];activeId=null;nextId=1;resetMotion(true);$('#stageCount').textContent=`STAGE ${String(i+1).padStart(2,'0')} / ${STAGES.length}　難度 ${STAGES[i].difficulty}`;$('#stageTitle').textContent=STAGES[i].title;$('#mission').textContent=STAGES[i].mission;refreshStagePicker();newExpr('');putStatus('下のボタンで式をつくって、▶ 走らせよう。');draw()}
function draw(){if(!ctx||cw<2||ch<2)return;ctx.clearRect(0,0,cw,ch);ctx.fillStyle='#0d1c30';ctx.fillRect(0,0,cw,ch);
 const gradient=ctx.createLinearGradient(0,0,cw,ch);gradient.addColorStop(0,'#102b42');gradient.addColorStop(1,'#081a2c');ctx.fillStyle=gradient;ctx.fillRect(0,0,cw,ch);
 ctx.lineWidth=1;for(let x=-1;x<=9;x++){ctx.beginPath();ctx.moveTo(XP(x),0);ctx.lineTo(XP(x),ch);ctx.strokeStyle=x===0?'#8199bc':'#54718d40';ctx.lineWidth=x===0?1.7:1;ctx.stroke()}
 for(let y=-3;y<=3;y++){ctx.beginPath();ctx.moveTo(0,YP(y));ctx.lineTo(cw,YP(y));ctx.strokeStyle=y===0?'#8199bc':'#54718d40';ctx.lineWidth=y===0?1.7:1;ctx.stroke()}
 ctx.fillStyle='#b1c5d8';ctx.font='11px system-ui';ctx.textBaseline='top';ctx.textAlign='center';for(let x=0;x<=8;x+=2)if(x!==0)ctx.fillText(x,XP(x),YP(0)+5);
 ctx.textAlign='right';ctx.textBaseline='middle';for(let y=-3;y<=3;y++){if(y!==0)ctx.fillText(y,XP(0)-6,YP(y))}
 ctx.textAlign='center';ctx.fillStyle='#d5e6f3';ctx.font='italic 16px Georgia';ctx.fillText('x',cw-11,YP(0)-15);ctx.fillText('y',XP(0)+16,14);
 for(const o of STAGES[stage].obstacles){let px=XP(o.x),py=YP(o.y+o.h),w=SW(o.w),h=SH(o.h);ctx.fillStyle='#bc45616e';ctx.fillRect(px,py,w,h);ctx.strokeStyle='#ff8ca5';ctx.lineWidth=1.7;ctx.strokeRect(px,py,w,h);ctx.save();ctx.beginPath();ctx.rect(px,py,w,h);ctx.clip();ctx.strokeStyle='#ef7d9c55';ctx.lineWidth=1;for(let s=-h;s<w+h;s+=14){ctx.beginPath();ctx.moveTo(px+s,py+h);ctx.lineTo(px+s+h,py);ctx.stroke()}ctx.restore()}
 for(const [i,g] of (STAGES[stage].gates||[]).entries()){
  const px=XP(g.x),py=YP(g.y),radius=Math.max(7,SH(g.r));ctx.save();ctx.strokeStyle=(i<gateIndex)?'#70e7ca':'#b5a1ff';ctx.fillStyle=(i<gateIndex)?'#70e7ca22':'#b5a1ff1d';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(px,py,5.5,radius,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.textAlign='center';ctx.font='bold 10px system-ui';ctx.fillStyle='#dbcfff';ctx.fillText(''+(i+1),px,py-radius-7);ctx.restore();
 }
 for(const e of expressions){if(!e.visible||!e.fn)continue;ctx.save();ctx.beginPath();ctx.rect(0,0,cw,ch);ctx.clip();ctx.beginPath();let prev=null;
  for(let n=0;n<=1400;n++){let x=world.xmin+(world.xmax-world.xmin)*n/1400,y=safe(e.fn,x);if(!Number.isFinite(y)||Math.abs(y)>500){prev=null;continue}let px=XP(x),py=YP(y);if(prev&&Math.abs(prev.y-y)<.45)ctx.lineTo(px,py);else ctx.moveTo(px,py);prev={y}}
  ctx.strokeStyle=e.color;ctx.lineWidth=e.id===activeId?3.4:2.1;ctx.globalAlpha=e.id===activeId?1:.55;ctx.lineJoin='round';ctx.stroke();ctx.restore()}
 if(trail.length>1){ctx.beginPath();for(let i=0;i<trail.length;i++){let [x,y]=trail[i];if(i===0)ctx.moveTo(XP(x),YP(y));else ctx.lineTo(XP(x),YP(y))}ctx.strokeStyle='#ffffffad';ctx.lineWidth=3;ctx.stroke()}
 // Mark target and origin.
 ctx.save();ctx.strokeStyle='#ffcd70';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(XP(8),YP(0),10,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#ffcd70';ctx.font='bold 11px system-ui';ctx.textAlign='right';ctx.fillText('GOAL',XP(8)-12,YP(0)-16);
 const curr=activeExpr();const yy=(playing||finished||crashed)&&curr?.fn?safe(curr.fn,riderX):0;let py=Number.isFinite(yy)?YP(yy):YP(0);
 ctx.fillStyle='#61e8cb';ctx.beginPath();ctx.arc(XP(0),YP(0),6,0,2*Math.PI);ctx.fill();ctx.font='bold 11px system-ui';ctx.textAlign='left';ctx.fillText('START (0,0)',XP(0)+11,YP(0)-17);
 if(py>0&&py<ch){let px=XP(riderX);ctx.shadowColor=crashed?'#ff7999':'#b3caff';ctx.shadowBlur=15;ctx.beginPath();ctx.arc(px,py,8.6,0,Math.PI*2);ctx.fillStyle=crashed?'#ff9ab1':'#d5e4ff';ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#122b41';ctx.beginPath();ctx.arc(px-2.5,py-1,1.2,0,2*Math.PI);ctx.arc(px+2.5,py-1,1.2,0,2*Math.PI);ctx.fill()}
 ctx.restore();
}
function run(){const e=activeExpr();if(playing||!e)return;updateFns();updateNotes();if(!e.fn){putStatus(e.error||'式を入力してください。','bad');return}
 if(!e.visible){e.visible=true;renderRows()}
 const start=safe(e.fn,0),end=safe(e.fn,8);
 if(!Number.isFinite(start)||Math.abs(start)>.12){putStatus('f(0)=0 を満たす式を入力してね。','bad');return}
 if(!Number.isFinite(end)||Math.abs(end)>.12){putStatus('f(8)=0 を満たす式を入力してね。','bad');return}
 resetMotion(true);playing=true;$('#run').disabled=true;$('#run').textContent='走行中…';putStatus('グラフに沿って走行中…');lastTime=0;trail=[[0,start]];frame=requestAnimationFrame(tick)
}
function tick(now){if(!playing)return;let dt=lastTime?Math.min((now-lastTime)/1000,.06):0;lastTime=now;let target=Math.min(8,riderX+dt*2.85),fn=activeExpr()?.fn;
 while(riderX+1e-7<target){riderX=Math.min(target,riderX+.018);let y=safe(fn,riderX);
  if(!Number.isFinite(y)||y<world.ymin+.12||y>world.ymax-.12){stop(false,'コースアウト！ x≈'+riderX.toFixed(2));return}
  if(STAGES[stage].obstacles.some(o=>collision(riderX,y,o))){stop(false,'障害物に当たった！ x≈'+riderX.toFixed(2));return}
  const gate=STAGES[stage].gates?.[gateIndex];if(gate&&riderX>=gate.x){let gy=safe(fn,gate.x);if(!Number.isFinite(gy)||Math.abs(gy-gate.y)>gate.r){stop(false,'ゲート'+(gateIndex+1)+'を通れなかった！');return}gateIndex++}
  trail.push([riderX,y]);
 }
 draw();if(riderX>=8-1e-6){stop(true,stage===STAGES.length-1?'全12ステージクリア！':'クリア！ 次のステージが開放されました。');return}
 frame=requestAnimationFrame(tick)
}
function stop(success,msg){playing=false;finished=success;crashed=!success;if(success&&unlocked<stage+2){unlocked=clampUnlock(stage+2);try{localStorage.setItem('graphRunnerUnlocked',String(unlocked))}catch{}refreshStagePicker()}$('#run').disabled=false;$('#run').textContent=success?'✓ もう一度走る':'↻ 再挑戦';$('#next').disabled=!(success&&stage<STAGES.length-1);putStatus(msg,success?'good':'bad');draw()}
function selectedInput(){return document.querySelector(`.expr-input[data-expr-id="${activeId}"]`)}
function commitInput(input,text,pos){const e=activeExpr();if(!e||!input)return;input.value=text;e.text=text;input.dispatchEvent(new Event('input',{bubbles:true}));input.focus({preventScroll:true});pos=clamp(pos,0,text.length);input.setSelectionRange(pos,pos)}
function replaceSelection(insert,caretOffset=insert.length){const input=selectedInput();if(!input)return;const a=input.selectionStart??input.value.length,b=input.selectionEnd??a;commitInput(input,input.value.slice(0,a)+insert+input.value.slice(b),a+caretOffset)}
function inputCommand(cmd){const input=selectedInput();if(!input)return;let a=input.selectionStart??input.value.length,b=input.selectionEnd??a,v=input.value;
 if(cmd==='clear'){commitInput(input,'',0);return}
 if(cmd==='back'){if(a===b&&a>0)a--;commitInput(input,v.slice(0,a)+v.slice(b),a);return}
 if(cmd==='left'){const p=a===b?Math.max(0,a-1):a;input.focus({preventScroll:true});input.setSelectionRange(p,p);return}
 if(cmd==='right'){let p=a===b?Math.min(v.length,a+1):b;if(v.slice(p-1,p+2)===')/(')p=Math.min(v.length,p+2);input.focus({preventScroll:true});input.setSelectionRange(p,p);return}
}
function insertTemplate(kind){const input=selectedInput();if(!input)return;const a=input.selectionStart??input.value.length,b=input.selectionEnd??a,selected=input.value.slice(a,b);
 if(kind==='power'){replaceSelection('^()',2);return}
 if(kind==='fraction'){if(selected){replaceSelection('('+selected+')/()',selected.length+4)}else replaceSelection('()/()',1);return}
 if(kind==='inverse'){replaceSelection('1/('+selected+')',selected?selected.length+3:3);return}
 const text=kind+'('+selected+')';replaceSelection(text,selected?text.length:kind.length+1)
}
function updateVisibleViewport(){const v=window.visualViewport;const height=v?v.height:window.innerHeight,top=v?v.offsetTop:0;document.documentElement.style.setProperty('--vvh',height+'px');document.documentElement.style.setProperty('--vtop',top+'px');const mobile=window.matchMedia('(max-width:760px)').matches;document.querySelectorAll('.expr-input').forEach(el=>{el.readOnly=mobile;el.inputMode=mobile?'none':'text'});$('#app').classList.remove('keyboard-open');requestAnimationFrame(resizeCanvas)}
function resizeCanvas(){const box=canvas.getBoundingClientRect();if(!box.width||!box.height)return;const dpr=Math.min(2,window.devicePixelRatio||1);cw=box.width;ch=box.height;const pw=Math.round(cw*dpr),ph=Math.round(ch*dpr);if(canvas.width!==pw||canvas.height!==ph){canvas.width=pw;canvas.height=ph}ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
$('#add').addEventListener('click',()=>{newExpr('');updateActiveRows()});
$('#hint').addEventListener('click',()=>putStatus(STAGES[stage].hint));
$('#run').addEventListener('click',run);
$('#reset').addEventListener('click',()=>resetMotion());
$('#next').addEventListener('click',()=>{if(finished&&stage<STAGES.length-1)loadStage(stage+1)});
$('#stageSelect').addEventListener('change',e=>loadStage(Number(e.target.value)));
for(const btn of document.querySelectorAll('[data-tab]'))btn.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(b=>{let active=b===btn;b.classList.toggle('selected',active);b.setAttribute('aria-pressed',String(active))});document.querySelectorAll('[data-panel]').forEach(p=>p.hidden=p.dataset.panel!==btn.dataset.tab)});
for(const btn of document.querySelectorAll('[data-ins],[data-key],[data-insert]')){btn.addEventListener('pointerdown',e=>e.preventDefault());btn.addEventListener('click',()=>{if(btn.dataset.ins!==undefined)replaceSelection(btn.dataset.ins);else if(btn.dataset.key)inputCommand(btn.dataset.key);else insertTemplate(btn.dataset.insert)})}
window.addEventListener('resize',updateVisibleViewport);
window.visualViewport?.addEventListener('resize',updateVisibleViewport);
window.visualViewport?.addEventListener('scroll',updateVisibleViewport);
document.addEventListener('focusin',()=>setTimeout(updateVisibleViewport,70));
document.addEventListener('focusout',()=>setTimeout(updateVisibleViewport,140));
window.addEventListener('orientationchange',()=>setTimeout(updateVisibleViewport,200));
new ResizeObserver(()=>resizeCanvas()).observe($('#frame'));
window.GRAPH_RUNNER_TEST={STAGES,parseFunction,pathCheck,collision,loadStage,replaceSelection,inputCommand,insertTemplate};
loadStage(0);updateVisibleViewport();resizeCanvas();
</script>
